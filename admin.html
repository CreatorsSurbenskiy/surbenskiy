<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURBENSKIY — Админ панель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #4CAF50; margin-bottom: 10px; }
        .sub { text-align: center; color: #888; margin-bottom: 40px; }
        
        .card {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #4CAF50;
        }
        .card h3 { color: #4CAF50; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #45a049; }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { color: #4CAF50; }
        .rank-gold { color: #FFD700; }
        .rank-silver { color: #C0C0C0; }
        .rank-bronze { color: #CD7F32; }
        .rank-green { color: #4CAF50; }
        
        .footer { text-align: center; margin-top: 40px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 АДМИН ПАНЕЛЬ SURBENSKIY</h1>
        <div class="sub">Управление тестерами и выдача званий</div>

        <!-- Форма добавления тестера -->
        <div class="card">
            <h3>➕ ДОБАВИТЬ ТЕСТЕРА</h3>
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="username" placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label>Звание</label>
                <select id="rank">
                    <option value="Основатель">👑 Основатель</option>
                    <option value="Главный тестер">🏆 Главный тестер</option>
                    <option value="Активный тестер">⭐ Активный тестер</option>
                    <option value="Тестер">🛡️ Тестер</option>
                    <option value="Новичок">🔰 Новичок</option>
                </select>
            </div>
            <button onclick="addTester()">➕ ДОБАВИТЬ</button>
        </div>

        <!-- Список тестеров -->
        <div class="card">
            <h3>📋 СПИСОК ТЕСТЕРОВ</h3>
            <div style="overflow-x: auto;">
                <table id="testersTable">
                    <thead>
                        <tr><th>Логин</th><th>Звание</th><th>Действия</th></tr>
                    </thead>
                    <tbody id="testersList">
                        <tr><td>admin</td><td class="rank-gold">👑 Основатель</td><td><button onclick="deleteTester('admin')" style="background:#f44336">Удалить</button></td></tr>
                        <tr><td>guest</td><td class="rank-green">🔰 Новичок</td><td><button onclick="deleteTester('guest')" style="background:#f44336">Удалить</button></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            ⚡ Звания выдаются за реальный вклад в развитие SURBENSKIY.<br>
            Данные сохраняются локально в браузере (localStorage).
        </div>
    </div>

    <script>
        // Загрузка тестеров из localStorage
        let testers = JSON.parse(localStorage.getItem('surbenskiy_testers')) || [
            { username: "admin", rank: "Основатель" },
            { username: "guest", rank: "Новичок" }
        ];

        function saveTesters() {
            localStorage.setItem('surbenskiy_testers', JSON.stringify(testers));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('testersList');
            tbody.innerHTML = '';
            testers.forEach(t => {
                const row = tbody.insertRow();
                const rankClass = getRankClass(t.rank);
                row.innerHTML = `
                    <td>${t.username}</td>
                    <td class="${rankClass}">${getRankIcon(t.rank)} ${t.rank}</td>
                    <td><button onclick="deleteTester('${t.username}')" style="background:#f44336">Удалить</button></td>
                `;
            });
        }

        function getRankIcon(rank) {
            const icons = {
                'Основатель': '👑',
                'Главный тестер': '🏆',
                'Ակտիվный тестер': '⭐',
                'Тестер': '🛡️',
                'Новичок': '🔰'
            };
            return icons[rank] || '🛡️';
        }

        function getRankClass(rank) {
            const classes = {
                'Основатель': 'rank-gold',
                'Главный тестер': 'rank-gold',
                'Активный тестер': 'rank-silver',
                'Тестер': 'rank-bronze',
                'Новичок': 'rank-green'
            };
            return classes[rank] || '';
        }

        function addTester() {
            const username = document.getElementById('username').value.trim();
            const rank = document.getElementById('rank').value;
            if (!username) {
                alert('Введите логин');
                return;
            }
            if (testers.find(t => t.username === username)) {
                alert('Тестер уже существует');
                return;
            }
            testers.push({ username, rank });
            saveTesters();
            document.getElementById('username').value = '';
            alert('Тестер добавлен!');
        }

        function deleteTester(username) {
            if (confirm(`Удалить тестера ${username}?`)) {
                testers = testers.filter(t => t.username !== username);
                saveTesters();
                alert('Тестер удалён');
            }
        }

        renderTable();
    </script>
</body>
</html>
